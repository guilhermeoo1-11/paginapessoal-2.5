    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #101C2C;
            overflow: hidden;
            font-family: monospace;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>

<body>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 960;
canvas.height = 540;

ctx.imageSmoothingEnabled = false;


// ===============================
// CONFIGURAÇÕES
// ===============================

const MAPA_LARGURA = 3000;
const MAPA_ALTURA = 1200;

let cameraX = 0;
let cameraY = 0;

let pontuacao = 0;
let vidas = 3;
let jogoTerminou = false;
let venceu = false;


// ===============================
// TECLAS
// ===============================

const teclas = {};

document.addEventListener("keydown", (e) => {
    teclas[e.key.toLowerCase()] = true;

    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(e.key.toLowerCase())) {
        e.preventDefault();
    }

    if (e.key.toLowerCase() === "r" && jogoTerminou) {
        reiniciar();
    }
});

document.addEventListener("keyup", (e) => {
    teclas[e.key.toLowerCase()] = false;
});


// ===============================
// JOGADOR
// ===============================

const jogador = {

    x: 150,
    y: 700,

    largura: 32,
    altura: 40,

    velocidade: 4,

    vx: 0,
    vy: 0,

    noChao: false,

    direcao: 1,

    animacao: 0,

    invencivel: 0
};


// ===============================
// PLATAFORMAS
// ===============================

const plataformas = [

    {x: 0, y: 820, largura: 3000, altura: 80},

    {x: 250, y: 700, largura: 250, altura: 30},
    {x: 650, y: 600, largura: 250, altura: 30},
    {x: 1050, y: 720, largura: 300, altura: 30},
    {x: 1450, y: 580, largura: 250, altura: 30},
    {x: 1800, y: 700, largura: 280, altura: 30},
    {x: 2200, y: 560, largura: 300, altura: 30},
    {x: 2600, y: 700, largura: 250, altura: 30}

];


// ===============================
// MOEDAS
// ===============================

let moedas = [

    {x: 330, y: 650, coletada: false},
    {x: 720, y: 550, coletada: false},
    {x: 1120, y: 670, coletada: false},
    {x: 1510, y: 530, coletada: false},
    {x: 1900, y: 650, coletada: false},
    {x: 2280, y: 510, coletada: false},
    {x: 2700, y: 650, coletada: false}

];


// ===============================
// INIMIGOS
// ===============================

let inimigos = [

    {
        x: 550,
        y: 780,
        largura: 35,
        altura: 35,
        velocidade: 1.5,
        direcao: 1
    },

    {
        x: 1250,
        y: 680,
        largura: 35,
        altura: 35,
        velocidade: 1.8,
        direcao: -1
    },

    {
        x: 1750,
        y: 780,
        largura: 35,
        altura: 35,
        velocidade: 1.4,
        direcao: 1
    },

    {
        x: 2400,
        y: 520,
        largura: 35,
        altura: 35,
        velocidade: 1.7,
        direcao: -1
    }

];


// ===============================
// ESTRELAS DO CÉU
// ===============================

const estrelas = [];

for (let i = 0; i < 100; i++) {

    estrelas.push({

        x: Math.random() * MAPA_LARGURA,
        y: Math.random() * 500,

        tamanho: Math.random() * 3 + 1

    });

}


// ===============================
// CONTROLE DO JOGADOR
// ===============================

function controlarJogador() {

    jogador.vx = 0;

    if (teclas["a"] || teclas["arrowleft"]) {

        jogador.vx = -jogador.velocidade;
        jogador.direcao = -1;

    }

    if (teclas["d"] || teclas["arrowright"]) {

        jogador.vx = jogador.velocidade;
        jogador.direcao = 1;

    }

    if (
        (teclas["w"] ||
        teclas["arrowup"] ||
        teclas[" "]) &&
        jogador.noChao
    ) {

        jogador.vy = -12;
        jogador.noChao = false;

    }

}


// ===============================
// FÍSICA
// ===============================

function aplicarFisica() {

    jogador.vy += 0.5;

    jogador.x += jogador.vx;
    jogador.y += jogador.vy;

    jogador.noChao = false;


    for (const p of plataformas) {

        if (

            jogador.x < p.x + p.largura &&
            jogador.x + jogador.largura > p.x &&
            jogador.y + jogador.altura >= p.y &&
            jogador.y + jogador.altura <= p.y + p.altura + jogador.vy + 5

        ) {

            if (jogador.vy >= 0) {

                jogador.y = p.y - jogador.altura;

                jogador.vy = 0;

                jogador.noChao = true;

            }

        }

    }


    if (jogador.x < 0)
        jogador.x = 0;

    if (jogador.x > MAPA_LARGURA - jogador.largura)
        jogador.x = MAPA_LARGURA - jogador.largura;


    if (jogador.y > MAPA_ALTURA) {

        perderVida();

    }

}


// ===============================
// MOEDAS
// ===============================

function atualizarMoedas() {

    for (const moeda of moedas) {

        if (moeda.coletada)
            continue;

        const distanciaX =
            jogador.x + jogador.largura / 2 - moeda.x;

        const distanciaY =
            jogador.y + jogador.altura / 2 - moeda.y;

        const distancia =
            Math.sqrt(distanciaX ** 2 + distanciaY ** 2);


        if (distancia < 35) {

            moeda.coletada = true;

            pontuacao += 100;

        }

    }


    if (moedas.every(m => m.coletada)) {

        venceu = true;
        jogoTerminou = true;

    }

}


// ===============================
// INIMIGOS
// ===============================

function atualizarInimigos() {

    for (const inimigo of inimigos) {

        inimigo.x += inimigo.velocidade * inimigo.direcao;


        if (
            inimigo.x < 0 ||
            inimigo.x > MAPA_LARGURA - inimigo.largura
        ) {

            inimigo.direcao *= -1;

        }


        if (jogador.invencivel > 0)
            continue;


        if (

            jogador.x < inimigo.x + inimigo.largura &&
            jogador.x + jogador.largura > inimigo.x &&
            jogador.y < inimigo.y + inimigo.altura &&
            jogador.y + jogador.altura > inimigo.y

        ) {

            perderVida();

        }

    }

}


// ===============================
// PERDER VIDA
// ===============================

function perderVida() {

    if (jogador.invencivel > 0)
        return;


    vidas--;

    jogador.invencivel = 120;

    jogador.x = 150;
    jogador.y = 700;

    jogador.vy = 0;


    if (vidas <= 0) {

        jogoTerminou = true;
        venceu = false;

    }

}


// ===============================
// CÂMERA
// ===============================

function atualizarCamera() {

    cameraX =
        jogador.x - canvas.width / 2;

    cameraY =
        jogador.y - canvas.height / 2;


    if (cameraX < 0)
        cameraX = 0;

    if (cameraY < 0)
        cameraY = 0;


    if (cameraX > MAPA_LARGURA - canvas.width)
        cameraX = MAPA_LARGURA - canvas.width;

    if (cameraY > MAPA_ALTURA - canvas.height)
        cameraY = MAPA_ALTURA - canvas.height;

}


// ===============================
// DESENHAR FUNDO
// ===============================

function desenharFundo() {

    ctx.fillStyle = "#111B32";
    ctx.fillRect(0, 0, canvas.width, canvas.height);


    // LUA

    ctx.fillStyle = "#FFF3B0";

    ctx.fillRect(
        760 - cameraX * 0.15,
        80 - cameraY * 0.05,
        60,
        60
    );


    // ESTRELAS

    ctx.fillStyle = "#FFFFFF";

    for (const estrela of estrelas) {

        const x = estrela.x - cameraX * 0.2;
        const y = estrela.y - cameraY * 0.1;

        if (x > 0 && x < canvas.width) {

            ctx.fillRect(
                x,
                y,
                estrela.tamanho,
                estrela.tamanho
            );

        }

    }


    // MONTANHAS

    ctx.fillStyle = "#182A42";

    for (let x = -500; x < MAPA_LARGURA; x += 500) {

        ctx.beginPath();

        ctx.moveTo(x - cameraX * 0.4, 820);

        ctx.lineTo(x + 250 - cameraX * 0.4, 350);

        ctx.lineTo(x + 500 - cameraX * 0.4, 820);

        ctx.fill();

    }

}


// ===============================
// DESENHAR PLATAFORMAS
// ===============================

function desenharPlataformas() {

    for (const p of plataformas) {

        ctx.fillStyle = "#3A6B3F";

        ctx.fillRect(
            p.x - cameraX,
            p.y - cameraY,
            p.largura,
            p.altura
        );


        ctx.fillStyle = "#5C963F";

        ctx.fillRect(
            p.x - cameraX,
            p.y - cameraY,
            p.largura,
            10
        );

    }

}


// ===============================
// DESENHAR MOEDAS
// ===============================

function desenharMoedas() {

    for (const moeda of moedas) {

        if (moeda.coletada)
            continue;


        const x = moeda.x - cameraX;
        const y = moeda.y - cameraY;


        ctx.fillStyle = "#F7C843";

        ctx.fillRect(
            x - 10,
            y - 14,
            20,
            28
        );


        ctx.fillStyle = "#FFE98A";

        ctx.fillRect(
            x - 3,
            y - 10,
            5,
            20
        );

    }

}


// ===============================
// DESENHAR INIMIGOS
// ===============================

function desenharInimigos() {

    for (const inimigo of inimigos) {

        const x = inimigo.x - cameraX;
        const y = inimigo.y - cameraY;


        ctx.fillStyle = "#B83A3A";

        ctx.fillRect(
            x,
            y,
            inimigo.largura,
            inimigo.altura
        );


        // olhos

        ctx.fillStyle = "#FFFFFF";

        ctx.fillRect(x + 7, y + 8, 7, 7);
        ctx.fillRect(x + 21, y + 8, 7, 7);


        ctx.fillStyle = "#000000";

        ctx.fillRect(x + 9, y + 10, 4, 4);
        ctx.fillRect(x + 23, y + 10, 4, 4);

    }

}


// ===============================
// DESENHAR JOGADOR
// ===============================

function desenharJogador() {

    if (
        jogador.invencivel > 0 &&
        Math.floor(jogador.invencivel / 8) % 2 === 0
    )
        return;


    const x = jogador.x - cameraX;
    const y = jogador.y - cameraY;


    // corpo

    ctx.fillStyle = "#D97732";

    ctx.fillRect(
        x,
        y + 8,
        jogador.largura,
        32
    );


    // cabeça

    ctx.fillStyle = "#F2B27D";

    ctx.fillRect(
        x + 4,
        y,
        24,
        22
    );


    // cabelo

    ctx.fillStyle = "#3A2418";

    ctx.fillRect(
        x + 4,
        y,
        24,
        7
    );


    // olhos

    ctx.fillStyle = "#FFFFFF";

    ctx.fillRect(
        x + 8,
        y + 9,
        5,
        5
    );

    ctx.fillRect(
        x + 20,
        y + 9,
        5,
        5
    );


    ctx.fillStyle = "#000000";

    ctx.fillRect(
        x + 10,
        y + 11,
        2,
        2
    );

    ctx.fillRect(
        x + 22,
        y + 11,
        2,
        2
    );


    // pernas

    ctx.fillStyle = "#263B5A";

    ctx.fillRect(
        x + 4,
        y + 34,
        10,
        6
    );

    ctx.fillRect(
        x + 18,
        y + 34,
        10,
        6
    );

}


// ===============================
// HUD
// ===============================

function desenharHUD() {

    ctx.fillStyle = "#FFFFFF";

    ctx.font = "22px monospace";

    ctx.fillText(
        "PONTOS: " + pontuacao,
        25,
        35
    );


    ctx.fillText(
        "VIDAS: " + "♥".repeat(vidas),
        25,
        65
    );


    ctx.fillText(
        "MOEDAS: " +
        moedas.filter(m => m.coletada).length +
        "/" +
        moedas.length,
        25,
        95
    );


    ctx.font = "16px monospace";

    ctx.fillText(
        "WASD / SETAS = MOVER   ESPAÇO = PULAR",
        25,
        canvas.height - 20
    );

}


// ===============================
// TELA FINAL
// ===============================

function desenharTelaFinal() {

    ctx.fillStyle = "rgba(0, 0, 0, 0.75)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.textAlign = "center";


    if (venceu) {

        ctx.fillStyle = "#F7C843";

        ctx.font = "50px monospace";

        ctx.fillText(
            "VOCÊ VENCEU!",
            canvas.width / 2,
            canvas.height / 2 - 40
        );

    } else {

        ctx.fillStyle = "#E05252";

        ctx.font = "50px monospace";

        ctx.fillText(
            "GAME OVER",
            canvas.width / 2,
            canvas.height / 2 - 40
        );

    }


    ctx.fillStyle = "#FFFFFF";

    ctx.font = "22px monospace";

    ctx.fillText(
        "PONTUAÇÃO: " + pontuacao,
        canvas.width / 2,
        canvas.height / 2 + 10
    );


    ctx.fillText(
        "PRESSIONE R PARA JOGAR NOVAMENTE",
        canvas.width / 2,
        canvas.height / 2 + 60
    );


    ctx.textAlign = "left";

}


// ===============================
// LOOP PRINCIPAL
// ===============================

function atualizar() {

    if (!jogoTerminou) {

        controlarJogador();

        aplicarFisica();

        atualizarMoedas();

        atualizarInimigos();

        atualizarCamera();


        if (jogador.invencivel > 0)
            jogador.invencivel--;

    }

}


function desenhar() {

    desenharFundo();

    desenharPlataformas();

    desenharMoedas();

    desenharInimigos();

    desenharJogador();

    desenharHUD();


    if (jogoTerminou) {

        desenharTelaFinal();

    }

}


function loop() {

    atualizar();

    desenhar();

    requestAnimationFrame(loop);

}


// ===============================
// REINICIAR
// ===============================

function reiniciar() {

    jogador.x = 150;
    jogador.y = 700;
    jogador.vx = 0;
    jogador.vy = 0;

    vidas = 3;

    pontuacao = 0;

    jogoTerminou = false;

    venceu = false;

    moedas.forEach(m => {
        m.coletada = false;
    });

}


loop();

</script>
