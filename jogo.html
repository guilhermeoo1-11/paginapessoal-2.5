    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #101C2C;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* BORDA QUE SEPARA O JOGO DA PÁGINA */
        .area-jogo {
            width: 95%;
            max-width: 1100px;
            margin: 40px auto;
            padding: 12px;

            border: 8px solid #D97732;
            border-radius: 25px;

            background: #050914;
            box-shadow: 0 0 25px rgba(217, 119, 50, 0.4);
        }

        .titulo-jogo {
            text-align: center;
            padding: 15px;
            color: #D97732;
            font-size: 28px;
        }

        #jogo {
            display: block;
            width: 100%;
            height: 600px;

            background: #050914;
            border-radius: 15px;

            image-rendering: pixelated;
        }

        .placar {
            text-align: center;
            font-size: 20px;
            padding-bottom: 10px;
        }

        .controles {
            text-align: center;
            padding: 15px;
            color: #ccc;
        }
    </style>
</head>

<body>

    <section class="area-jogo">

        <h1 class="titulo-jogo">
            🚀 BATALHA ESPACIAL
        </h1>

        <div class="placar">
            Pontos: <span id="pontos">0</span>
        </div>

        <canvas id="jogo" width="900" height="500"></canvas>

        <div class="controles">
            ← ↑ ↓ → para mover | ESPAÇO para atirar
        </div>

    </section>
