    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #101C2C;
            font-family: monospace;
            min-height: 150vh;
            overflow-x: hidden;
        }

        /* ÁREA DO JOGO */

        .game-container {
            width: 90%;
            max-width: 1000px;

            margin: 80px auto;

            padding: 15px;

            border: 6px solid #D97732;
            border-radius: 18px;

            background: #080F1A;

            box-shadow:
                0 0 0 4px #182A42,
                0 15px 30px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;

            width: 100%;
            height: auto;

            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* CONTEÚDO ABAIXO DO JOGO */

        .conteudo {
            width: 90%;
            max-width: 1000px;

            margin: 0 auto 100px;

            padding: 40px;

            background: #182A42;

            border-radius: 15px;

            color: white;

            text-align: center;
        }

        .conteudo h1 {
            color: #D97732;
            margin-bottom: 20px;
        }

        .conteudo p {
            font-size: 18px;
            line-height: 1.6;
        }

    </style>
</head>

<body>

    <script>

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        ctx.imageSmoothingEnabled = false;


        // =========================
        // JOGADOR
        // =========================

        const jogador = {

            x: 100,
            y: 400,

            largura: 32,
            altura: 40,

            velocidade: 4,

            velocidadeY: 0,

            pulando: false

        };


        // =========================
        // TECLAS
        // =========================

        const teclas = {};

        document.addEventListener("keydown", function(event) {

            teclas[event.key.toLowerCase()] = true;

        });

        document.addEventListener("keyup", function(event) {

            teclas[event.key.toLowerCase()] = false;

        });


        // =========================
        // PLATAFORMAS
        // =========================

        const plataformas = [

            {
                x: 0,
                y: 480,
                largura: 960,
                altura: 60
            },

            {
                x: 180,
                y: 380,
                largura: 180,
                altura: 20
            },

            {
                x: 480,
                y: 300,
                largura: 180,
                altura: 20
            },

            {
                x: 750,
                y: 400,
                largura: 150,
                altura: 20
            }

        ];


        // =========================
        // MOEDAS
        // =========================

        const moedas = [

            {
                x: 250,
                y: 340,
                coletada: false
            },

            {
                x: 550,
                y: 260,
                coletada: false
            },

            {
                x: 800,
                y: 360,
                coletada: false
            }

        ];


        let pontos = 0;


        // =========================
        // ATUALIZAR JOGO
        // =========================

        function atualizar() {

            // MOVIMENTO

            if (
                teclas["a"] ||
                teclas["arrowleft"]
            ) {

                jogador.x -= jogador.velocidade;

            }


            if (
                teclas["d"] ||
                teclas["arrowright"]
            ) {

                jogador.x += jogador.velocidade;

            }


            // PULO

            if (

                (
                    teclas["w"] ||
                    teclas["arrowup"] ||
                    teclas[" "]
                )

                &&

                !jogador.pulando

            ) {

                jogador.velocidadeY = -11;

                jogador.pulando = true;

            }


            // GRAVIDADE

            jogador.velocidadeY += 0.5;

            jogador.y += jogador.velocidadeY;


            jogador.pulando = true;


            // COLISÃO

            for (const plataforma of plataformas) {

                if (

                    jogador.x <
                    plataforma.x +
                    plataforma.largura

                    &&

                    jogador.x +
                    jogador.largura >
                    plataforma.x

                    &&

                    jogador.y +
                    jogador.altura >=
                    plataforma.y

                    &&

                    jogador.y +
                    jogador.altura <=
                    plataforma.y +
                    plataforma.altura +
                    10

                    &&

                    jogador.velocidadeY >= 0

                ) {

                    jogador.y =
                        plataforma.y -
                        jogador.altura;

                    jogador.velocidadeY = 0;

                    jogador.pulando = false;

                }

            }


            // LIMITES

            if (jogador.x < 0) {

                jogador.x = 0;

            }


            if (
                jogador.x +
                jogador.largura >
                canvas.width
            ) {

                jogador.x =
                    canvas.width -
                    jogador.largura;

            }


            // CAIU

            if (jogador.y > canvas.height) {

                jogador.x = 100;

                jogador.y = 400;

                jogador.velocidadeY = 0;

            }


            // PEGAR MOEDAS

            for (const moeda of moedas) {

                if (moeda.coletada)
                    continue;


                if (

                    jogador.x <
                    moeda.x + 18

                    &&

                    jogador.x +
                    jogador.largura >
                    moeda.x

                    &&

                    jogador.y <
                    moeda.y + 18

                    &&

                    jogador.y +
                    jogador.altura >
                    moeda.y

                ) {

                    moeda.coletada = true;

                    pontos += 100;

                }

            }

        }

            ctx.fillStyle = "#111B32";

            );

            ctx.fillStyle = "#FFFFFF";

            const estrelas = [

                [600,70],

            ];


            for (const estrela of estrelas) {

                ctx.fillRect(
                    estrela[0],
                    estrela[1],
                    4,
                    4
                );

            }

        }
